name: Immiscible agent configuration check
description: Fails a pull request that adds a coding-agent hook, plugin or MCP server not on the repository's allow list (immiscible scan --ci), and can check its signed attestation of what the agents did (immiscible attest --check).
author: Eóin Forker
branding:
  icon: shield
  color: blue
inputs:
  token:
    description: An Immiscible CLI token (immiscible token create --name ci). With one, the workspace's own allow list counts too and each run shows on the Agents page. Leave it out to check against the repository's allow list alone.
    required: false
    default: ''
  url:
    description: Your Immiscible server, when it is not the hosted one.
    required: false
    default: ''
  directory:
    description: The repository directory to check.
    required: false
    default: '.'
  attestation:
    description: "off (the default), check (a signed attestation on the pull request is verified; an unguarded agent or a broken decision log fails the job) or require (as check, and the pull request must carry one for its head commit)."
    required: false
    default: 'off'
runs:
  using: composite
  steps:
    # The CLI has no dependencies, so it runs from this checkout of the action: nothing is installed from npm.
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - shell: bash
      working-directory: ${{ inputs.directory }}
      env:
        IMMISCIBLE_TOKEN: ${{ inputs.token }}
        # Always set, so a pull request's .env cannot choose where the token goes.
        IMMISCIBLE_URL: ${{ inputs.url || 'https://immiscible.ai' }}
      run: node "$GITHUB_ACTION_PATH/bin/immiscible.mjs" scan --ci
    - if: inputs.attestation != 'off' && github.event.pull_request
      shell: bash
      working-directory: ${{ inputs.directory }}
      env:
        GH_TOKEN: ${{ github.token }}
        IMMISCIBLE_TOKEN: ${{ inputs.token }}
        IMMISCIBLE_URL: ${{ inputs.url || 'https://immiscible.ai' }}
        STRICT: ${{ inputs.attestation == 'require' && '--strict' || '' }}
      run: node "$GITHUB_ACTION_PATH/bin/immiscible.mjs" attest --check $STRICT
